[project]
name = "document-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your name", email = "steverahimovs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.9",
    "numpy>=2.5.4",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
]


[project.scripts]
document-knowledge-assistant = "document_knowledge_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
